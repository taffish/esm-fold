[package]
name = "esm-fold"
kind = "tool"
version = "2.0.0"
release = 2
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/esm-fold"

[command]
name = "taf-esm-fold"

[meta]
domain = "bio"
categories = ["protein-structure", "structure-prediction", "deep-learning", "protein"]
keywords = ["esmfold", "esm", "protein-language-model", "structure-prediction", "pdb", "gpu", "cpu", "pytorch", "openfold"]
description = "TAFFISH wrapper for ESMFold structure prediction from protein FASTA sequences, with persistent model cache and automatic NVIDIA runtime flag selection."

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/esm-fold:2.0.0-r2"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[upstream]
type = "github"
repo = "facebookresearch/esm"
homepage = "https://github.com/facebookresearch/esm"
release_url = "https://github.com/facebookresearch/esm/releases/tag/v2.0.0"
downloads = "https://pypi.org/project/fair-esm/2.0.0/"
version = "2.0.0"
license = "MIT"
citation = "Lin et al. 2023"
doi = "10.1126/science.ade2574"
pmid = "36927031"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["esm-fold", "python", "python3", "pip", "nvcc"]
test = ["esm-fold -h | grep -F 'Path to input FASTA file' >/dev/null", "python -c 'import importlib.metadata as m; assert m.version(\"fair-esm\") == \"2.0.0\"'", "python -c 'import torch; assert torch.__version__.startswith(\"1.12.1\")'", "python -c 'import esm, openfold, deepspeed, dllogger, tree; assert callable(esm.pretrained.esmfold_v1)'", "python -c 'from pathlib import Path; assert \"model = model.float()\" in Path(\"/opt/esm/scripts/esmfold_inference.py\").read_text()'", "python -c 'from pathlib import Path; from esm.data import read_fasta; p=Path(\"/tmp/taf-esm-fold-smoke.fa\"); p.write_text(\">toy\\nMKT\\n\"); assert list(read_fasta(p)) == [(\"toy\", \"MKT\")]'"]
